name: Public Interest Cross-Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-interest-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x64
          - runner: ubuntu-24.04-arm
            label: linux-arm64
          - runner: windows-latest
            label: windows-x64
          - runner: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project test dependency
        run: python -m pip install -e . pytest
      - name: Run deterministic test suite
        run: python -m pytest -q
      - name: Compile public source
        run: python -m compileall -q src tests
      - name: Emit source-bound runner receipt
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci_runner_receipt.py
          --output "evidence/ci-runners/${{ matrix.label }}.json"
          --label "${{ matrix.label }}"
          --schema "hal.public-interest-runner.v1"
      - uses: actions/upload-artifact@v4
        with:
          name: public-interest-${{ matrix.label }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/ci-runners/${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 7
