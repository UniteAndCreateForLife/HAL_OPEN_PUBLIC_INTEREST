name: hal-node-v0

on:
  push:
    paths:
      - "src/hal_public_interest/node.py"
      - "scripts/install_hal_node_windows.ps1"
      - "tests/test_node_v0.py"
      - "tests/test_node_installer_static.py"
      - "docs/HAL_NODE_V0.md"
      - "pyproject.toml"
      - ".github/workflows/hal-node-v0.yml"
  pull_request:
    paths:
      - "src/hal_public_interest/node.py"
      - "scripts/install_hal_node_windows.ps1"
      - "tests/test_node_v0.py"
      - "tests/test_node_installer_static.py"
      - "docs/HAL_NODE_V0.md"
      - "pyproject.toml"
      - ".github/workflows/hal-node-v0.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Run HAL Node tests
        run: python -m pytest -q tests/test_node_v0.py tests/test_node_installer_static.py tests/test_audit.py
      - name: Compile
        run: python -m py_compile src/hal_public_interest/node.py tests/test_node_v0.py tests/test_node_installer_static.py
      - name: Windows bootstrap plan-mode canary
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_hal_node_windows.ps1
