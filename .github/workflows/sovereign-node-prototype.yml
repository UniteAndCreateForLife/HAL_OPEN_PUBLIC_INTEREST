name: sovereign node prototype

on:
  push:
    branches:
      - foresight-local-compute-2026
    paths:
      - "prototypes/sovereign_node/**"
      - ".github/workflows/sovereign-node-prototype.yml"
  pull_request:
    paths:
      - "prototypes/sovereign_node/**"
      - ".github/workflows/sovereign-node-prototype.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test node doctor
        working-directory: prototypes/sovereign_node
        run: python -m unittest -v
      - name: Smoke node doctor
        working-directory: prototypes/sovereign_node
        run: python node_doctor.py
