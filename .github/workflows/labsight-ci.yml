name: HAL LabSight CI

on:
  push:
    branches: [opencv-2026-labsight]
    paths:
      - "competitions/opencv-2026-labsight/**"
      - ".github/workflows/labsight-ci.yml"
  pull_request:
    paths:
      - "competitions/opencv-2026-labsight/**"
      - ".github/workflows/labsight-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: competitions/opencv-2026-labsight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development/test dependencies
        run: python -m pip install -e '.[test]'
      - name: Tests
        run: pytest -q
      - name: Static submission-readiness gate
        run: labsight-readiness --static-only --output evaluation/ci/readiness-static.json
      - name: Regression benchmark
        run: python -m labsight.evaluation --seeds 10 --output evaluation/ci

  opencv5-competition-evidence:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: competitions/opencv-2026-labsight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact competition runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-competition.txt
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Prove exact OpenCV 5 runtime
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p evaluation/ci-opencv5
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path
          from labsight.runtime import competition_runtime_info

          runtime = competition_runtime_info()
          payload = {
              "source_sha": os.environ["SOURCE_SHA"],
              "python": sys.version.split()[0],
              "platform": platform.platform(),
              "runtime": runtime,
              "scope": "clean GitHub runner; exact OpenCV 5 reproducibility evidence, not AWS deployment evidence",
          }
          output = Path("evaluation/ci-opencv5/runtime.json")
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2))
          if not runtime["opencv5_verified"]:
              raise SystemExit("exact OpenCV 5 competition runtime verification failed")
          PY
          python -m pip freeze > evaluation/ci-opencv5/pip-freeze.txt
      - name: Deterministic tests under exact OpenCV 5
        run: pytest -q
      - name: 100-sample OpenCV 5 benchmark
        run: python -m labsight.evaluation --seeds 25 --output evaluation/ci-opencv5
      - name: Upload OpenCV 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labsight-opencv5-${{ github.sha }}
          path: competitions/opencv-2026-labsight/evaluation/ci-opencv5
          if-no-files-found: error
          retention-days: 30
