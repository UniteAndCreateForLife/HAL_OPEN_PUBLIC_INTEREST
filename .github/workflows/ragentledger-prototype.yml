name: ragentledger prototype

on:
  push:
    branches:
      - r-consortium-isc-2026-2
    paths:
      - "prototypes/ragentledger/**"
      - ".github/workflows/ragentledger-prototype.yml"
  pull_request:
    paths:
      - "prototypes/ragentledger/**"
      - ".github/workflows/ragentledger-prototype.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install prototype dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "digest"))'
      - name: Run prototype smoke test
        working-directory: prototypes/ragentledger
        run: Rscript tests/smoke.R
