AWSTemplateFormatVersion: '2010-09-09'
Description: HAL LabSight public App Runner service
Parameters:
  ImageIdentifier:
    Type: String
    Description: Immutable ECR image identifier, preferably repository@sha256:digest
Resources:
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: hal-labsight
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
      InstanceConfiguration:
        Cpu: '1 vCPU'
        Memory: '2 GB'
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
Outputs:
  ServiceUrl:
    Value: !GetAtt Service.ServiceUrl
  ServiceArn:
    Value: !GetAtt Service.ServiceArn
