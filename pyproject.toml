[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-public-interest"
version = "0.1.0"
description = "Small, inspectable primitives for local AI routing and provenance evidence."
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "HAL public-interest contributors"}]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
